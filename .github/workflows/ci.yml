name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint - Typecheck - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del frontend
        uses: actions/checkout@v4
        with:
          path: monitor-ciid-web

      - name: Checkout del backend
        uses: actions/checkout@v4
        with:
          repository: Designdigitalestefania/Monitor-ciid-mexico
          path: ciid-mexico

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build backend
        working-directory: ciid-mexico
        run: |
          npm install --no-audit --no-fund
          npm run build
          echo "=== Verificando dist/ del backend ==="
          ls -la dist/
          test -f dist/index.d.ts || (echo "ERROR: dist/index.d.ts no existe" && exit 1)
          test -f dist/index.js || (echo "ERROR: dist/index.js no existe" && exit 1)

      - name: Install frontend dependencies
        working-directory: monitor-ciid-web
        run: npm install --no-audit --no-fund

      - name: Forzar dist/ del backend en node_modules
        working-directory: monitor-ciid-web
        run: |
          rm -rf node_modules/ciid-mexico
          mkdir -p node_modules/ciid-mexico
          cp -r ../ciid-mexico/dist node_modules/ciid-mexico/dist
          cp ../ciid-mexico/package.json node_modules/ciid-mexico/package.json
          echo "=== Verificando node_modules/ciid-mexico ==="
          ls -la node_modules/ciid-mexico/
          ls -la node_modules/ciid-mexico/dist/

      - name: Lint
        working-directory: monitor-ciid-web
        run: npm run lint

      - name: Typecheck
        working-directory: monitor-ciid-web
        run: npx tsc --noEmit

      - name: Build
        working-directory: monitor-ciid-web
        run: npm run build
