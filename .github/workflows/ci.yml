name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint - Typecheck - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del frontend
        uses: actions/checkout@v4
        with:
          path: monitor-ciid-web

      - name: Checkout del backend
        uses: actions/checkout@v4
        with:
          repository: Designdigitalestefania/Monitor-ciid-mexico
          path: ciid-mexico
          token: ${{ secrets.CIID_BACKEND_TOKEN || github.token }}

      - name: Verificar estructura clonada
        run: |
          echo "=== Estructura raíz ==="
          ls -la
          echo ""
          echo "=== Frontend ==="
          ls -la monitor-ciid-web | head -10
          echo ""
          echo "=== Backend ==="
          ls -la ciid-mexico | head -10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build backend
        working-directory: ciid-mexico
        run: |
          echo "=== Instalando dependencias del backend ==="
          npm install --no-audit --no-fund
          echo "=== Compilando backend ==="
          npm run build
          echo "=== Verificando dist/ ==="
          ls -la dist/ | head -10

      - name: Install frontend dependencies
        working-directory: monitor-ciid-web
        run: |
          echo "=== Verificando que ../ciid-mexico existe ==="
          ls -la ../ciid-mexico | head -5
          echo ""
          echo "=== Instalando dependencias del frontend ==="
          npm install --no-audit --no-fund

      - name: Lint
        working-directory: monitor-ciid-web
        run: npm run lint

      - name: Typecheck
        working-directory: monitor-ciid-web
        run: npx tsc --noEmit

      - name: Build
        working-directory: monitor-ciid-web
        run: npm run build
