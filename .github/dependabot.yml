version: 2
updates:
  # Actualizaciones mensuales únicamente para dependencias de producción de npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # Excluye devDependencies: solo se permiten dependencias de producción
    allow:
      - dependency-type: "production"

  # Actualizaciones mensuales para GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"